spring:
  # ============================================================
  # APPLICATION
  # ============================================================

  application:
    name: notification-service


  # ============================================================
  # DATABASE
  # ============================================================

  datasource:
    url: ${DB_URL_NOTIFICATION}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


  # ============================================================
  # JPA / HIBERNATE
  # ============================================================

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    # Local IntelliJ:
    # localhost:9092
    #
    # Docker/AWS:
    # kafka:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    # ----------------------------------------------------------
    # Default consumer configuration
    #
    # Used by the normal notification consumers:
    # - user-registered-event
    # - balance-update-notification-event
    # ----------------------------------------------------------

    consumer:
      group-id: notification-group

      auto-offset-reset: earliest

      enable-auto-commit: true

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Normal notification events use JSON deserialization.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:

        # ErrorHandlingDeserializer delegates to JsonDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # Existing event mappings
        spring.json.type.mapping: >-
          com.buuchezo.useraccountservice.kafka.dto.UserRegistrationEvent:
          com.buuchezo.notificationservice.kafka.dto.UserRegistrationEvent,
          com.buuchezo.useraccountservice.kafka.dto.BalanceUpdateEvent:
          com.buuchezo.notificationservice.kafka.dto.BalanceUpdateEvent


  # ============================================================
  # EMAIL / GMAIL SMTP
  # ============================================================

  mail:
    host: smtp.gmail.com

    port: 587

    username: masinde156@gmail.com

    # Gmail App Password
    # Never hard-code the actual password here.
    password: ${APP_EMAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true

            required: true


# ==============================================================
# SERVER
# ==============================================================

server:
  port: 8083


# ==============================================================
# ACTUATOR
# ==============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info


# ==============================================================
# EUREKA
# ==============================================================

eureka:
  client:

    register-with-eureka: true

    fetch-registry: true

    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:

    prefer-ip-address: true

    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}